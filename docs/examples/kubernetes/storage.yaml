# See ../../self-host-kubernetes.md before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: robots-database
  labels:
    robots.example/phase: foundation
  namespace: robots
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: robots-data
  labels:
    robots.example/phase: foundation
  namespace: robots
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: robots-web-assets
  labels:
    robots.example/phase: foundation
  namespace: robots
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
