# See ../../self-host-kubernetes.md before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robots-postgres
  labels:
    robots.example/phase: foundation
  namespace: robots
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: robots-postgres
  template:
    metadata:
      labels:
        app: robots-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: docker.io/library/postgres@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: robots-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              value: robots
            - name: POSTGRES_DB
              value: robots
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: robots-database
---
apiVersion: v1
kind: Service
metadata:
  name: robots-postgres
  labels:
    robots.example/phase: foundation
  namespace: robots
spec:
  selector:
    app: robots-postgres
  ports:
    - port: 5432
      targetPort: 5432
