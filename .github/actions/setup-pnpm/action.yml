name: Setup pnpm
description: Install pnpm into this job's temp directory, keep its store there, and give git an empty job-local config so host settings cannot change its output.
runs:
  using: composite
  steps:
    - name: Isolate pnpm store and git config
      shell: bash
      run: |
        set -euo pipefail
        : > "$RUNNER_TEMP/gitconfig"
        {
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_NOSYSTEM=1"
        } >> "$GITHUB_ENV"

    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        dest: ${{ runner.temp }}/setup-pnpm
