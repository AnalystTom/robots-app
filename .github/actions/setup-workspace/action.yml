name: Setup workspace
description: Install pnpm and Node, point install, Electron and turbo caches at the runner's persistent CI cache, and install the workspace for CI jobs.
inputs:
  electron:
    description: Download the Electron binary (needed for desktop smoke and native computer jobs).
    required: false
    default: "false"
  turbo:
    description: Which turbo local cache to use (none, check, or build).
    required: false
    default: "none"
  filter:
    description: Optional pnpm --filter argument (for example @robots/desktop...).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24

    - name: Use the persistent Electron and turbo caches
      shell: bash
      env:
        SETUP_TURBO: ${{ inputs.turbo }}
      run: |
        set -euo pipefail
        cache_dir() { bash "$GITHUB_ACTION_PATH/../../scripts/ci-cache-dir.sh" "$1"; }
        echo "electron_config_cache=$(cache_dir electron)" >> "$GITHUB_ENV"
        if [[ "$SETUP_TURBO" == check || "$SETUP_TURBO" == build ]]; then
          turbo_dir="$(cache_dir "turbo-$SETUP_TURBO")"
          find "$turbo_dir" -type f -mtime +14 -delete
          echo "TURBO_CACHE_DIR=$turbo_dir" >> "$GITHUB_ENV"
        fi

    - name: Install dependencies
      shell: bash
      env:
        SETUP_ELECTRON: ${{ inputs.electron }}
        SETUP_FILTER: ${{ inputs.filter }}
      run: |
        set -euo pipefail
        if [[ "${SETUP_ELECTRON}" != "true" ]]; then
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export pnpm_config_prefer_offline=true
        fi
        filter_args=()
        if [[ -n "${SETUP_FILTER}" ]]; then
          filter_args=(--filter "${SETUP_FILTER}" --filter robots)
        fi
        pnpm install --frozen-lockfile "${filter_args[@]}"
        if [[ "${SETUP_ELECTRON}" == "true" ]]; then
          install_js="$(pnpm --filter @robots/desktop exec node -p "require('path').join(require('path').dirname(require.resolve('electron/package.json')), 'install.js')")"
          if [[ -z "$install_js" ]]; then
            echo "electron/install.js not found after pnpm install" >&2
            exit 1
          fi
          for attempt in 1 2 3 4; do
            if node "$install_js"; then
              break
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo "Electron binary download failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
        fi
