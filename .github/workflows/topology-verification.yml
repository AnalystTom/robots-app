name: manual topology verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    name: Production topology smoke
    runs-on: [self-hosted, big-machine]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:topology
      - name: Replay computer tools against real Chromium without inference
        run: pnpm test:computer-replay --image=robots/computer:topology
