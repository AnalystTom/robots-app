name: preview-build

# Builds a pull request's preview image, including from forks. This half runs the pull request's
# code, so it gets a read-only token and no secrets; preview-deploy.yml picks up the image.
# See infra/preview/README.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/**"
      - "infra/compose/Dockerfile"
      - "infra/preview/**"
      - "patches/**"
      - "scripts/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build preview image
    runs-on: [self-hosted, big-machine]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_IMAGE: robots-preview:run-${{ github.run_id }}
        run: |
          docker image ls --filter 'reference=robots-preview:run-*' --filter until=72h --quiet | xargs -r docker image rm --force
          docker build -f infra/compose/Dockerfile --build-arg GIT_SHA="$GIT_SHA" \
            -t robots-server:preview .
          docker build --build-arg SERVER_IMAGE=robots-server:preview -t "$PREVIEW_IMAGE" \
            infra/preview
