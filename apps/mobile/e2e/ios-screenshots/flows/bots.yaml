appId: com.analysttom.robotsapp
name: Bots
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ROBOTS_ACTIVE_EMAIL: ${ROBOTS_SCREENSHOT_EMAIL}
- openLink: "robots:///bot-profile?botId=${ROBOTS_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*Routines.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-bot-profile
- tapOn: ".*Routines.*"
- extendedWaitUntil:
    visible: ".*Weekly fixture review.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-routines
- openLink: "robots:///bot-model?botId=${ROBOTS_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*Space default.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-bot-model
- openLink: "robots:///peer-chat?botId=${ROBOTS_SCREENSHOT_BOT_ID}&botName=Researcher&peerBotId=${ROBOTS_SCREENSHOT_PEER_BOT_ID}&peerBotName=Writer"
- extendedWaitUntil:
    visible: ".*draft the announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-peer-chat
- openLink: "robots:///routine?botId=${ROBOTS_SCREENSHOT_BOT_ID}&botName=Researcher"
- extendedWaitUntil:
    visible: "Add schedule"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*How often.*"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-new-routine
