appId: com.analysttom.robotsapp
name: Skills
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ROBOTS_ACTIVE_EMAIL: ${ROBOTS_SCREENSHOT_EMAIL}
- openLink: "robots:///skills"
- extendedWaitUntil:
    visible: ".*Review Kit.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-skills
- tapOn: "RoBots"
- extendedWaitUntil:
    visible: ".*name: RoBots.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-skill
- tapOn: "Back"
- tapOn: ".*New skill.*"
- extendedWaitUntil:
    visible: "Save"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-skill
- openLink: "robots:///skills"
- tapOn: ".*Review Kit.*"
- extendedWaitUntil:
    visible: ".*Install.*|.*Add.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-plugin
- openLink: "robots:///bot-templates"
- extendedWaitUntil:
    visible: "Create Morning briefing"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-bot-templates
