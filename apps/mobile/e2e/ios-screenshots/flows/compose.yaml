appId: com.analysttom.robotsapp
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ROBOTS_ACTIVE_EMAIL: ${ROBOTS_SCREENSHOT_EMAIL}
- openLink: "robots:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "robots:///new-bot"
- extendedWaitUntil:
    visible: "Name your Bot"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02b-new-bot
- tapOn: "Cancel"
- openLink: "robots:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- tapOn: "Researcher"
- tapOn: "Writer"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-group
- tapOn: "Next"
- assertVisible: "Skip"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-new-group-name
- openLink: "robots:///"
